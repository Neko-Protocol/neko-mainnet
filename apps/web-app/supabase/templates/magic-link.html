<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your Neko email</title>
  </head>
  <body
    style="
      margin: 0;
      background: #0f0f0f;
      font-family: Arial, sans-serif;
      color: #f8fafc;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #0f0f0f; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 520px;
              background: #181818;
              border: 1px solid #2a2a2a;
              border-radius: 8px;
              padding: 28px;
            "
          >
            <tr>
              <td>
                <h1
                  style="
                    margin: 0 0 12px;
                    font-size: 22px;
                    line-height: 1.25;
                    color: #ffffff;
                  "
                >
                  Verify your email
                </h1>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #b7b7b7;
                  "
                >
                  Confirm this email address for your Neko account.
                </p>
                <a
                  href="{{ .SiteURL }}/api/users/email/confirm?wallet={{ .Data.wallet_address }}&token_hash={{ .TokenHash }}&type=magiclink"
                  style="
                    display: inline-block;
                    border-radius: 6px;
                    background: #10b981;
                    color: #06130f;
                    font-size: 15px;
                    font-weight: 700;
                    line-height: 1;
                    text-decoration: none;
                    padding: 14px 18px;
                  "
                >
                  Verify email
                </a>
                <p
                  style="
                    margin: 24px 0 0;
                    font-size: 12px;
                    line-height: 1.5;
                    color: #737373;
                  "
                >
                  This link expires automatically. If you did not request it,
                  you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
